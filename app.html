<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>EBx MUSIC — эфир</title>
  <meta name="description" content="Авторская AI радиостанция: рок, постпанк, протест. Эфир 6:00–23:00 МСК.">
  <meta name="theme-color" content="#0A0A0B">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230A0A0B'/%3E%3Cpath d='M20 3 6 19h7l-3 10L26 12h-8l2-9z' fill='%23B31217'/%3E%3C/svg%3E">
  <style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0A0A0B; }
  :root { --app-vh: 100dvh; }
  #__boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #9AA0A8; font: 14px/1.4 system-ui, sans-serif; letter-spacing: .14em; text-transform: uppercase; z-index: 10; }
  </style>
  <script>
  // Telegram WebApp SDK — только внутри Telegram; MAX — по UA (SDK пока нет)
  (function () {
    if (location.search.includes('tgWebAppData') || /Telegram/i.test(navigator.userAgent)) {
      var s = document.createElement('script');
      s.src = 'https://telegram.org/js/telegram-web-app.js';
      document.head.append(s);
    }
  })();
  </script>
  <script type="module" crossorigin src="/assets/app-B-oU-s0k.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/weather-BRMVdkbV.js">
  <link rel="stylesheet" crossorigin href="/assets/weather-gKUDQ7B-.css">
</head>
<body class="app-mode">
  <div id="__boot">EBx MUSIC…</div>

  <div class="app-shell">
    <!-- верхняя строка: бренд / ON AIR / огонёк -->
    <header class="app-top">
      <div class="app-brand">EBx<b>■</b>MUSIC</div>
      <span class="app-onair">ON AIR</span>
      <div class="app-flame" id="appFlame">
        <button class="flame-btn" id="flameBtn" aria-label="Подкинуть огонёк">
          <span class="flame-emoji">🔥</span>
          <span class="flame-count" id="flameCount">0</span>
        </button>
      </div>
    </header>

    <!-- вертикальный плеер: обложка → мета → волна → play → громкость -->
    <section class="player" aria-label="Плеер эфира">
      <div class="app-cover">
        <video class="rain-overlay" muted loop playsinline preload="none" data-src="assets/rain-compressed.webm" aria-hidden="true"></video>
        <!-- фоторяд инжектится сюда (weather.ts) -->
      </div>

      <div class="app-meta">
        <div id="trackTitle">—</div>
        <div id="trackArtist">—</div>
        <div id="trackTime">0:00 · LIVE</div>
      </div>

      <div class="scope-wrap app-wave">
        <canvas id="wave"></canvas>
      </div>

      <div class="app-controls">
        <button class="play-btn" id="playBtn" aria-label="Слушать">
          <span class="pb-ring" aria-hidden="true"></span>
          <svg class="pb-ic pb-play" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M8 5.2v13.6c0 .8.9 1.3 1.6.9l10.8-6.8c.6-.4.6-1.4 0-1.8L9.6 4.3C8.9 3.9 8 4.4 8 5.2z" fill="currentColor"/></svg>
          <svg class="pb-ic pb-pause" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="6" y="4.5" width="4.4" height="15" rx="1.6" fill="currentColor"/><rect x="13.6" y="4.5" width="4.4" height="15" rx="1.6" fill="currentColor"/></svg>
        </button>
        <div class="app-vol">
          <label for="vol">ГРОМК</label><input type="range" id="vol" min="0" max="1" step="0.01">
        </div>
        <span id="listeners">—</span>
      </div>

      <button class="app-fresh" id="freshBtn" title="Давно не было новинок?">Давно не было новинок?</button>
      <!-- ночью сюда добавляется вуаль «ЭФИР СПИТ» -->
    </section>
  </div>

</body>
</html>
